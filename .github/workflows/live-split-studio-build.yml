name: Build Live Split Studio macOS

on:
  push:
    branches:
      - build/live-split-studio-server-stable
    paths:
      - 'live-split-studio/**'
      - '.github/workflows/live-split-studio-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build x64
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: live-split-studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build renderer
        run: npm run build:renderer

      - name: Build ZIP app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac zip --x64 --publish never

      - name: Upload ZIP app
        uses: actions/upload-artifact@v4
        with:
          name: Live-Split-Studio-macOS-x64
          path: live-split-studio/release/*.zip
          if-no-files-found: error
