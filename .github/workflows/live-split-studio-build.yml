name: Build Live Split Studio macOS

on:
  push:
    branches:
      - build/live-split-studio-v3-1
    paths:
      - 'live-split-studio/**'
      - '.github/workflows/live-split-studio-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: live-split-studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build renderer
        run: npm run build:renderer

      - name: Build macOS packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Live-Split-Studio-macOS-${{ matrix.arch }}
          path: |
            live-split-studio/release/*.dmg
            live-split-studio/release/*.zip
          if-no-files-found: error
